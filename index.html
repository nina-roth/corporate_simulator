<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Corporate Dashboard</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #f4f4f4; height: 100vh; display: flex; flex-direction: column; }
    header { background: #333; color: #fff; padding: 10px; text-align: center; }
    nav { background: #222; display: flex; justify-content: center; gap: 10px; padding: 10px; }
    nav button { padding: 10px; background: #444; color: white; border: none; border-radius: 4px; }
    nav button:hover { background: #666; }
    #view-container { flex: 1; padding: 10px; overflow-y: auto; }
  </style>
</head>
<body>
  <header><h1>📂 Corporate Dashboard</h1></header>
  <nav>
    <button onclick="loadView('email_inbox')">📧 Email</button>
    <button onclick="loadView('chat')">💬 Chat</button>
    <button onclick="loadView('other')">🗂 Other</button>
  </nav>
  <div id="view-container">Loading...</div>

  <script>
    async function loadView(viewName) {
      try {
        const response = await fetch(`views/${viewName}.html`);
        const html = await response.text();
        document.getElementById('view-container').innerHTML = html;

        // Optional: re-bind event handlers in the new content
        if (viewName === 'email_inbox' && typeof setupEmailView === 'function') {
          setupEmailView();
        }
      } catch (err) {
        document.getElementById('view-container').innerHTML = "<p>Error loading view.</p>";
        console.error(err);
      }
    }

    loadView('email_inbox'); // default view
  </script>
</body>
</html>
