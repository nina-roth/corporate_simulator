<body>
  <header>
    <h1>📂 Corporate Dashboard</h1>
    <div class="nav">
      <button onclick="showView('email')">📧 Email</button>
      <button onclick="showView('chat')">💬 Chat</button>
      <button onclick="showView('other')">🗂 Other</button>
    </div>
  </header>

  <div class="views">
    <!-- EMAIL VIEW -->
    <div id="email-view" class="view">
      <!-- same inbox layout here -->
    </div>

    <!-- CHAT VIEW -->
    <div id="chat-view" class="view hidden">
      <div class="content">💬 This is your chat window.</div>
    </div>

    <!-- OTHER VIEW -->
    <div id="other-view" class="view hidden">
      <div class="content">📁 Other modules go here.</div>
    </div>
  </div>

  <script>
    function showView(view) {
      document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
      document.getElementById(`${view}-view`).classList.remove('hidden');
    }

    // Optional: load inbox on first view
    showView('email');
  </script>

  <style>
    .nav {
      background: #222;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 10px;
    }
    .nav button {
      padding: 10px 15px;
      background-color: #555;
      color: white;
      border: none;
      border-radius: 4px;
    }
    .nav button:hover {
      background-color: #777;
    }
    .views {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .view.hidden { display: none; }
    .view { flex: 1; padding: 10px; overflow-y: auto; }
    .content { padding: 20px; background: white; border: 1px solid #ccc; }
  </style>
</body>
